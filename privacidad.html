<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Notice | MyUtahSpot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <main class="max-w-3xl mx-auto px-5 py-12">
        <div class="flex items-center justify-between gap-4">
            <a href="index.html" id="backLink" class="text-blue-600 font-semibold">← Back to MyUtahSpot</a>
            <div class="inline-flex rounded-lg border border-slate-200 bg-white p-1 text-sm font-semibold">
                <button type="button" data-lang="en" class="lang-btn px-3 py-1 rounded">EN</button>
                <button type="button" data-lang="es" class="lang-btn px-3 py-1 rounded">ES</button>
            </div>
        </div>
        <h1 id="pageTitle" class="text-3xl font-bold mt-6"></h1>
        <p id="effectiveDate" class="text-sm text-slate-500 mt-2"></p>
        <section id="content" class="mt-8 space-y-6 leading-7"></section>
    </main>
    <script>
        const privacy = {
            en: { title: 'Privacy Notice', date: 'Effective September 20, 2026', back: '← Back to MyUtahSpot', html: `
                <p>This notice explains how MyUtahSpot collects, uses, retains and shares information related to directory listings and reports.</p>
                <div><h2 class="font-bold text-xl">1. Controller and contact</h2><p>For privacy, correction or deletion requests, email <strong>myutahspotsupport@gmail.com</strong>.</p></div>
                <div><h2 class="font-bold text-xl">2. Information we collect</h2><p>When a listing is submitted, we collect the business or service name, category, city, phone number, description, optional image or logo, listing type, and the date and version of accepted terms. When a listing is reported, we collect the reporter's required email address, optional phone number, report reason, listing identifier and report date. When a visitor chats with Sofía, we store the messages, language, a pseudonymous browser identifier and conversation date so the team can improve answers and provide support. Technical providers may also process security logs necessary to operate and protect the site. When you create an account, we collect your email address, a securely hashed version of your password (we never store the password itself), the date and version of the terms you accepted, an optional phone number, and up to five business photos you upload. Photos are resized and re-encoded on upload, which removes hidden metadata such as location. We use a session cookie, strictly necessary to keep you signed in, that expires after 30 days or when you log out.</p></div>
                <div><h2 class="font-bold text-xl">3. Purposes</h2><p>We use listing information to display the listing, let visitors contact advertisers, administer and protect the service, review reports, respond to requests and comply with legal obligations. We use Sofía conversations to answer questions, identify unanswered topics and improve the chatbot. A listing's phone number, description and image are public. Reporter contact information and Sofía conversations are not published. We use account information to authenticate you, let you manage your phone number and photos, protect the service against abuse and contact you about your account. Your account email is never published; the phone number and photos in your account become public only when they are shown in a listing.</p></div>
                <div><h2 class="font-bold text-xl">4. Sharing and providers</h2><p>Listings are visible to directory visitors. We use Hostinger for hosting and MySQL for database storage. We do not sell personal information. We may disclose information when required by law or to protect rights, safety and prevent fraud.</p></div>
                <div><h2 class="font-bold text-xl">5. Retention, security and choices</h2><p>We retain listings and reports while active or as reasonably necessary to operate the directory, investigate reports, handle disputes and meet legal obligations. We use reasonable security measures, but no system is completely secure. You may request access, correction or deletion by email; we will verify the request before responding. This includes deleting your account, phone number and photos.</p></div>
                <div><h2 class="font-bold text-xl">6. Children, links and changes</h2><p>The service is not directed to children under 13. Do not publish minors' personal data without authorization. Advertiser links and communications follow their own practices. We may update this notice and will show the new effective date on this page.</p></div>` },
            es: { title: 'Aviso de privacidad', date: 'Vigente desde el 20 de septiembre de 2026', back: '← Volver a MyUtahSpot', html: `
                <p>Este aviso explica cómo MyUtahSpot recopila, usa, conserva y comparte los datos relacionados con las publicaciones y reportes de su directorio.</p>
                <div><h2 class="font-bold text-xl">1. Responsable y contacto</h2><p>Para solicitudes de privacidad, corrección o eliminación de datos, escribe a <strong>myutahspotsupport@gmail.com</strong>.</p></div>
                <div><h2 class="font-bold text-xl">2. Datos que recopilamos</h2><p>Cuando se envía una publicación recopilamos el nombre del negocio o servicio, categoría, ciudad, teléfono, descripción, imagen o logo opcional, tipo de publicación, fecha y versión de los términos aceptados. Cuando se reporta un anuncio, recopilamos el correo obligatorio de quien reporta, teléfono opcional, motivo, identificador del anuncio y fecha del reporte. Cuando una persona conversa con Sofía, guardamos los mensajes, idioma, un identificador seudónimo del navegador y la fecha de conversación para mejorar respuestas y brindar soporte. El servidor y proveedores técnicos también pueden procesar registros de seguridad necesarios para operar y proteger el sitio. Cuando creas una cuenta, recopilamos tu correo electrónico, una versión cifrada de tu contraseña (nunca guardamos la contraseña en sí), la fecha y versión de los términos que aceptaste, un teléfono opcional y hasta cinco fotos de tu negocio que subas. Las fotos se reducen y se vuelven a codificar al subirlas, lo que elimina metadatos ocultos como la ubicación. Usamos una cookie de sesión, estrictamente necesaria para mantener tu sesión iniciada, que vence a los 30 días o cuando cierras sesión.</p></div>
                <div><h2 class="font-bold text-xl">3. Finalidades</h2><p>Usamos los datos de publicaciones para mostrar el anuncio, permitir que visitantes contacten al anunciante, administrar y proteger el servicio, revisar reportes, atender solicitudes y cumplir obligaciones legales. Usamos las conversaciones con Sofía para responder preguntas, identificar temas sin respuesta y mejorar el chatbot. El teléfono, descripción e imagen de un anuncio se hacen públicos. Los datos de contacto de quien reporta y las conversaciones con Sofía no se publican. Usamos los datos de la cuenta para autenticarte, permitirte administrar tu teléfono y tus fotos, proteger el servicio contra abusos y comunicarnos contigo sobre tu cuenta. El correo de tu cuenta nunca se publica; el teléfono y las fotos de tu cuenta solo se hacen públicos cuando aparecen en un anuncio.</p></div>
                <div><h2 class="font-bold text-xl">4. Compartición y proveedores</h2><p>Las publicaciones son visibles para visitantes del directorio. Usamos Hostinger para alojamiento y MySQL para almacenamiento. No vendemos datos personales. Podemos divulgar información cuando la ley lo exija o para proteger derechos, seguridad y prevenir fraude.</p></div>
                <div><h2 class="font-bold text-xl">5. Conservación, seguridad y tus opciones</h2><p>Conservamos publicaciones y reportes mientras estén activos o mientras sea razonablemente necesario para operar el directorio, investigar reportes, atender disputas o cumplir obligaciones legales. Aplicamos medidas razonables de seguridad, aunque ningún sistema es totalmente seguro. Puedes solicitar acceso, corrección o eliminación por correo; verificaremos tu solicitud antes de responder. Esto incluye eliminar tu cuenta, teléfono y fotos.</p></div>
                <div><h2 class="font-bold text-xl">6. Menores, enlaces y cambios</h2><p>El servicio no está dirigido a menores de 13 años. No publiques datos personales de menores sin autorización. Los enlaces o comunicaciones con anunciantes se rigen por sus propias prácticas. Podemos actualizar este aviso y publicaremos la nueva fecha de vigencia en esta página.</p></div>` }
        };
        function render(lang) {
            const data = privacy[lang] || privacy.en;
            document.documentElement.lang = lang;
            document.title = `${data.title} | MyUtahSpot`;
            document.getElementById('backLink').textContent = data.back;
            document.getElementById('pageTitle').textContent = data.title;
            document.getElementById('effectiveDate').textContent = data.date;
            document.getElementById('content').innerHTML = data.html;
            document.querySelectorAll('.lang-btn').forEach(button => {
                const active = button.dataset.lang === lang;
                button.classList.toggle('bg-blue-600', active);
                button.classList.toggle('text-white', active);
            });
            try { localStorage.setItem('myutahspot_lang', lang); } catch (e) {}
        }
        document.querySelectorAll('.lang-btn').forEach(button => button.addEventListener('click', () => render(button.dataset.lang)));
        let preferred = 'en'; try { preferred = localStorage.getItem('myutahspot_lang') || 'en'; } catch (e) {} render(preferred);
    </script>
</body>
</html>
